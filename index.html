<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSO Inspection Monitoring Dashboard</title>
  <style>
    :root { --primary: #1a4f8b; --bg: #f4f6f9; --card: #ffffff; --border: #d1d9e6; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #222; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 18px 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    h2 { margin: 0; color: var(--primary); font-size: 1.35rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .card { background: var(--card); padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 4px solid var(--primary); }
    .card .num { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    .card .lbl { font-size: 0.85rem; color: #555; font-weight: 600; margin-top: 4px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; background: var(--card); padding: 14px; border-radius: 8px; margin-bottom: 16px; align-items: center; }
    select, input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.9rem; }
    button { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: 600; }
    button.secondary { background: #2e7d32; }
    .table-wrap { background: var(--card); border-radius: 8px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid #e5e9f0; }
    th { background: #eef3f9; color: #1a3b66; font-weight: 600; white-space: nowrap; }
    tr:hover { background: #f9fbfd; }
    .btn-view { display: inline-block; padding: 4px 10px; background: #e8f0fe; color: #1a4f8b; text-decoration: none; border-radius: 4px; font-weight: 600; font-size: 0.82rem; }
    .btn-view:hover { background: #d2e3fc; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2>NSO (FOD) RO Kadapa — Inspection Reports Monitor</h2>
        <div style="font-size:0.85rem; color:#666; margin-top:4px;">Live tracking of Inspection Notes across RO & SROs</div>
      </div>
      <div>
        <button onclick="loadData()">Refresh Data</button>
        <button class="secondary" onclick="exportCSV()">Export CSV</button>
      </div>
    </div>

    <div class="cards" id="summaryCards">
      <div class="card"><div class="num" id="totalCount">0</div><div class="lbl">Total Reports</div></div>
    </div>

    <div class="controls">
      <select id="filterSro" onchange="applyFilters()">
        <option value="">All Offices (NSRO/SRO)</option>
        <option value="RO Kadapa">RO Kadapa</option>
        <option value="SRO Anantapur">SRO Anantapur</option>
        <option value="SRO Guntur">SRO Guntur</option>
        <option value="SRO Kurnool">SRO Kurnool</option>
        <option value="SRO Nellore">SRO Nellore</option>
      </select>

      <input type="text" id="filterScheme" placeholder="Filter by Scheme (e.g., ASUSE)" onkeyup="applyFilters()">
      <input type="text" id="filterSearch" placeholder="Search Officer, FSU No, or Inspected Official..." onkeyup="applyFilters()" style="flex:1; min-width:220px;">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>NSRO / SRO</th>
            <th>Officer Name & Designation</th>
            <th>Scheme</th>
            <th>FSU No & Name</th>
            <th>Inspection Of</th>
            <th>Date of Inspection</th>
            <th>Note Submitted</th>
            <th>Inspection Note</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="9" style="text-align:center; padding:25px;">Loading inspection records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
    let allRecords = [];

    async function loadData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:25px;">Fetching latest data...</td></tr>';

      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        if (json.status === 'success') {
          allRecords = json.data.reverse(); // Latest first
          renderSummary(allRecords);
          applyFilters();
        } else {
          throw new Error(json.message);
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="9" style="color:red; text-align:center; padding:20px;">Error loading data: ${err.message}</td></tr>`;
      }
    }

    function renderSummary(records) {
      const counts = { 'RO Kadapa': 0, 'SRO Anantapur': 0, 'SRO Guntur': 0, 'SRO Kurnool': 0, 'SRO Nellore': 0 };
      records.forEach(r => {
        if (counts.hasOwnProperty(r.sro)) counts[r.sro]++;
        else counts[r.sro] = (counts[r.sro] || 0) + 1;
      });

      let html = `<div class="card"><div class="num">${records.length}</div><div class="lbl">Total Reports</div></div>`;
      for (const [office, count] of Object.entries(counts)) {
        html += `<div class="card"><div class="num">${count}</div><div class="lbl">${office}</div></div>`;
      }
      document.getElementById('summaryCards').innerHTML = html;
    }

    function applyFilters() {
      const sroVal = document.getElementById('filterSro').value.toLowerCase();
      const schemeVal = document.getElementById('filterScheme').value.toLowerCase();
      const searchVal = document.getElementById('filterSearch').value.toLowerCase();

      const filtered = allRecords.filter(r => {
        const matchSro = !sroVal || (r.sro && r.sro.toLowerCase() === sroVal);
        const matchScheme = !schemeVal || (r.scheme && r.scheme.toLowerCase().includes(schemeVal));
        const matchSearch = !searchVal || [r.officerName, r.fsuNo, r.fsuName, r.inspectionOf]
          .some(field => field && String(field).toLowerCase().includes(searchVal));
        return matchSro && matchScheme && matchSearch;
      });

      renderTable(filtered);
    }

    function renderTable(records) {
      const tbody = document.getElementById('tableBody');
      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:20px;">No matching inspection reports found.</td></tr>';
        return;
      }

      tbody.innerHTML = records.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><strong>${r.sro || '-'}</strong></td>
          <td>${r.officerName || '-'}<br><span style="font-size:0.8rem; color:#666;">${r.designation || ''}</span></td>
          <td>${r.scheme || '-'}</td>
          <td><strong>${r.fsuNo || '-'}</strong> — ${r.fsuName || '-'}</td>
          <td>${r.inspectionOf || '-'}</td>
          <td>${r.dateOfInspection || '-'}</td>
          <td>${r.dateNoteSubmitted || '-'}</td>
          <td>${r.fileUrl && r.fileUrl.startsWith('http') 
            ? `<a href="${r.fileUrl}" target="_blank" class="btn-view">View Note</a>` 
            : 'No File'}</td>
        </tr>
      `).join('');
    }

    function exportCSV() {
      if (!allRecords.length) return;
      const headers = ['SRO/NSRO', 'Officer Name', 'Designation', 'Scheme', 'FSU No', 'FSU Name', 'Inspection Of', 'Date of Inspection', 'Date Note Submitted', 'File URL'];
      const rows = allRecords.map(r => [
        r.sro, r.officerName, r.designation, r.scheme, r.fsuNo, r.fsuName, r.inspectionOf, r.dateOfInspection, r.dateNoteSubmitted, r.fileUrl
      ].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));

      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Inspection_Reports_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    loadData();
  </script>
</body>
</html>
